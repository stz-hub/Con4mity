<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Con4mity — Logs</title>
    <link rel="stylesheet" href="style.css?v=11" />
  </head>
  <body class="page" data-page-title-key="pageTitle.logs" data-nav-active="logs">
    <div class="shell">
      <header class="topbar">
        <div class="topbar__left">
          <img
            class="topbar__logo"
            src="assets/logo.png?v=5"
            alt="Con4mity"
            width="120"
            height="44"
            decoding="async"
          />
          <div class="topbar__titles">
            <p class="brand-name">CON4MITY</p>
            <p class="brand-sub">Open Source SIEM</p>
          </div>
        </div>
        <div class="topbar__right">
          <nav class="topbar__nav" aria-label="Main">
            <div id="main-nav-links" class="nav-links"></div>
          </nav>
          <button type="button" class="btn btn--ghost" id="logout" data-i18n="nav.logout">Déconnexion</button>
        </div>
      </header>

      <section class="page-intro">
        <h1 data-i18n="dashboard.heading">Flux des événements</h1>
        <p class="muted" data-i18n="dashboard.subtitle">Dernières entrées indexées dans OpenSearch</p>
      </section>

      <section class="kpis">
        <article class="kpi kpi--accent">
          <span class="kpi__label" data-i18n="dashboard.kpiNew">Alertes « nouvelles »</span>
          <span class="kpi__value" id="kpi-new">—</span>
        </article>
        <article class="kpi">
          <span class="kpi__label" data-i18n="dashboard.kpiProgress">En cours</span>
          <span class="kpi__value" id="kpi-progress">—</span>
        </article>
        <article class="kpi">
          <span class="kpi__label" data-i18n="dashboard.kpiResolved">Résolues</span>
          <span class="kpi__value" id="kpi-resolved">—</span>
        </article>
        <article class="kpi">
          <span class="kpi__label" data-i18n="dashboard.kpiTotal">Total alertes</span>
          <span class="kpi__value" id="kpi-total">—</span>
        </article>
        <article class="kpi">
          <span class="kpi__label" data-i18n="dashboard.kpiRefresh">Rafraîchissement auto</span>
          <span class="kpi__value" style="font-size: 1.25rem">30s</span>
        </article>
      </section>

      <section class="panel" style="margin-bottom: 1rem">
        <div class="panel__head">
          <h2 data-i18n="logs.filtersTitle">Filtres rapides</h2>
        </div>
        <div class="filter-grid">
          <label>
            <span data-i18n="logs.filterFrom">Depuis</span>
            <input type="datetime-local" id="f-from" />
          </label>
          <label>
            <span data-i18n="logs.filterTo">Jusqu'à</span>
            <input type="datetime-local" id="f-to" />
          </label>
          <label>
            <span data-i18n="logs.filterHost">Hôte</span>
            <input type="text" id="f-host" autocomplete="off" />
          </label>
          <label>
            <span data-i18n="logs.filterEvent">Type d'événement</span>
            <input type="text" id="f-event" placeholder="event.type" autocomplete="off" />
          </label>
          <label>
            <span data-i18n="logs.filterUser">Utilisateur</span>
            <input type="text" id="f-user" autocomplete="off" />
          </label>
        </div>
        <div class="toolbar">
          <button type="button" class="btn btn--primary" id="f-apply" data-i18n="logs.applyFilters">Appliquer</button>
          <button type="button" class="btn btn--ghost" id="f-clear" data-i18n="logs.clearFilters">Réinitialiser</button>
        </div>
      </section>

      <section class="panel">
        <div class="panel__head">
          <h2 data-i18n="dashboard.heading">Flux des événements</h2>
          <div class="panel__actions">
            <span class="muted" id="logs-status"></span>
            <button type="button" class="btn btn--sm btn--primary" id="refresh-now" data-i18n="dashboard.refresh">
              Actualiser
            </button>
          </div>
        </div>
        <div class="toolbar">
          <div class="search-field">
            <input
              type="search"
              id="log-search"
              data-i18n-placeholder="dashboard.searchPlaceholder"
              placeholder="Rechercher…"
              autocomplete="off"
            />
          </div>
        </div>
        <div class="table-wrap">
          <table class="table">
            <thead>
              <tr>
                <th data-i18n="dashboard.colTime">Date / heure</th>
                <th data-i18n="dashboard.colHost">Hôte</th>
                <th data-i18n="dashboard.colSeverity">Sévérité</th>
                <th data-i18n="dashboard.colMessage">Message</th>
              </tr>
            </thead>
            <tbody id="logs-body"></tbody>
          </table>
        </div>
      </section>
    </div>

    <div id="app-footer"></div>
    <script src="app.js?v=7"></script>
    <script src="i18n.js?v=6"></script>
    <script src="nav.js?v=5"></script>
    <script src="footer.js?v=5"></script>
    <script src="log-fields.js?v=1"></script>
    <script>
      if (!getToken()) window.location.href = "index.html";

      try {
        const raw = sessionStorage.getItem("con4mity_logs_prefill");
        if (raw) {
          const o = JSON.parse(raw);
          if (o.host) document.getElementById("f-host").value = o.host;
          if (o.q) document.getElementById("log-search").value = o.q;
          sessionStorage.removeItem("con4mity_logs_prefill");
        }
      } catch (_) {}

      document.getElementById("logout").onclick = () => {
        localStorage.removeItem("con4mity_token");
        window.location.href = "index.html";
      };

      function toIsoLocal(dtLocal) {
        if (!dtLocal) return "";
        const d = new Date(dtLocal);
        if (Number.isNaN(d.getTime())) return "";
        return d.toISOString();
      }

      function filterParams() {
        const q = document.getElementById("log-search").value.trim();
        const host = document.getElementById("f-host").value.trim();
        const event_type = document.getElementById("f-event").value.trim();
        const user_name = document.getElementById("f-user").value.trim();
        const from_ts = toIsoLocal(document.getElementById("f-from").value);
        const to_ts = toIsoLocal(document.getElementById("f-to").value);
        const params = { size: 200 };
        if (q) params.q = q;
        if (host) params.host = host;
        if (event_type) params.event_type = event_type;
        if (user_name) params.user_name = user_name;
        if (from_ts) params.from_ts = from_ts;
        if (to_ts) params.to_ts = to_ts;
        return params;
      }

      let allLogs = [];
      const LF = () =>
        window.Con4mityLogFields || {
          pickTime: (r) => r["@timestamp"] || "—",
          pickHost: () => "—",
          pickSeverity: () => "info",
          pickMessage: () => "—",
          severityPillClass: () => "pill pill--muted",
        };

      function formatLocaleDateTime(isoOrRaw) {
        try {
          const d = new Date(isoOrRaw);
          if (Number.isNaN(d.getTime())) return String(isoOrRaw);
          return d.toLocaleString(undefined, {
            day: "2-digit",
            month: "short",
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
          });
        } catch (_) {
          return String(isoOrRaw);
        }
      }

      function displayTime(row) {
        const raw = LF().pickTime(row);
        if (raw === "—") return raw;
        return formatLocaleDateTime(raw);
      }

      function filteredLogs() {
        const q = document.getElementById("log-search").value.trim().toLowerCase();
        if (!q) return allLogs;
        return allLogs.filter((row) => {
          const msg = String(LF().pickMessage(row)).toLowerCase();
          const host = String(LF().pickHost(row)).toLowerCase();
          return msg.includes(q) || host.includes(q);
        });
      }

      function renderLogs() {
        const rows = filteredLogs();
        const tb = document.getElementById("logs-body");
        tb.innerHTML = "";
        if (!allLogs.length) {
          const tr = document.createElement("tr");
          tr.innerHTML = `<td colspan="4" class="table-empty">${t("dashboard.noLogs")}</td>`;
          tb.appendChild(tr);
          return;
        }
        if (!rows.length) {
          const tr = document.createElement("tr");
          tr.innerHTML = `<td colspan="4" class="table-empty">${t("dashboard.noMatch")}</td>`;
          tb.appendChild(tr);
          return;
        }
        for (const row of rows) {
          const tr = document.createElement("tr");
          const sev = LF().pickSeverity(row);
          const msg = LF().pickMessage(row);
          const tdT = document.createElement("td");
          tdT.className = "mono";
          tdT.textContent = displayTime(row);
          const tdH = document.createElement("td");
          tdH.textContent = LF().pickHost(row);
          const tdS = document.createElement("td");
          const sp = document.createElement("span");
          sp.className = LF().severityPillClass(sev);
          sp.textContent = sev;
          tdS.appendChild(sp);
          const tdM = document.createElement("td");
          tdM.className = "msg";
          tdM.textContent = msg;
          if (msg.length > 120) tdM.title = msg;
          tr.appendChild(tdT);
          tr.appendChild(tdH);
          tr.appendChild(tdS);
          tr.appendChild(tdM);
          tb.appendChild(tr);
        }
      }

      function setLogsStatus(ok) {
        const st = document.getElementById("logs-status");
        if (!ok) return;
        const rows = filteredLogs();
        const n = rows.length;
        const now = formatLocaleDateTime(new Date().toISOString());
        st.textContent = t("dashboard.statusLines", { n, t: now });
      }

      async function loadStats() {
        const s = await apiGet("/stats");
        document.getElementById("kpi-new").textContent = s.new_alerts ?? "0";
        document.getElementById("kpi-progress").textContent = s.in_progress_alerts ?? "0";
        document.getElementById("kpi-resolved").textContent = s.resolved_alerts ?? "0";
        document.getElementById("kpi-total").textContent = s.total_alerts ?? "0";
      }

      async function loadLogs() {
        const st = document.getElementById("logs-status");
        st.textContent = t("dashboard.statusLoading");
        const rows = await apiGet("/logs", filterParams());
        allLogs = rows;
        renderLogs();
        setLogsStatus(true);
      }

      async function tick() {
        try {
          await loadStats();
          await loadLogs();
        } catch (e) {
          document.getElementById("logs-status").textContent = t("dashboard.statusError", { m: e.message });
        }
      }

      document.getElementById("log-search").addEventListener("input", () => {
        renderLogs();
        setLogsStatus(true);
      });

      document.getElementById("refresh-now").addEventListener("click", () => tick());
      document.getElementById("f-apply").addEventListener("click", () => tick());
      document.getElementById("f-clear").addEventListener("click", () => {
        ["f-from", "f-to", "f-host", "f-event", "f-user", "log-search"].forEach((id) => {
          const el = document.getElementById(id);
          if (el) el.value = "";
        });
        tick();
      });

      window.addEventListener("con4mity-lang", () => {
        renderLogs();
        setLogsStatus(true);
      });

      tick();
      setInterval(tick, 30_000);
    </script>
  </body>
</html>
