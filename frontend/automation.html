<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Con4mity — Automatisation</title>
    <link rel="stylesheet" href="style.css?v=12" />
  </head>
  <body class="page" data-page-title-key="pageTitle.automation" data-nav-active="automation">
    <div class="shell">
      <header class="topbar">
        <div class="topbar__left">
          <img
            class="topbar__logo"
            src="assets/logo.png?v=5"
            alt="Con4mity"
            width="120"
            height="44"
            decoding="async"
          />
          <div class="topbar__titles">
            <p class="brand-name">CON4MITY</p>
            <p class="brand-sub">Open Source SIEM</p>
          </div>
        </div>
        <div class="topbar__right">
          <nav class="topbar__nav" aria-label="Main">
            <div id="main-nav-links" class="nav-links"></div>
          </nav>
          <button type="button" class="btn btn--ghost" id="logout" data-i18n="nav.logout">Déconnexion</button>
        </div>
      </header>

      <section class="page-intro">
        <h1 data-i18n="nav.automation">Automatisation</h1>
        <p class="muted" data-i18n="automation.subtitle">Playbooks légers</p>
        <p class="muted" style="max-width: 52rem" data-i18n="automation.pageIntro">
          Actions guidées et journal d’audit — rappels opérationnels, pas d’exécution lourde distante.
        </p>
      </section>

      <section class="panel" style="margin-bottom: 1rem">
        <div class="panel__head">
          <h2 data-i18n="automation.playbooks">Playbooks</h2>
        </div>
        <div id="playbooks" class="chart-grid"></div>
      </section>

      <section class="panel">
        <div class="panel__head">
          <h2 data-i18n="automation.history">Historique</h2>
          <button type="button" class="btn btn--sm btn--ghost" id="btn-refresh" data-i18n="overview.refresh">
            Rafraîchir
          </button>
        </div>
        <div class="table-wrap">
          <table class="table">
            <thead>
              <tr>
                <th data-i18n="alerts.colDate">Date</th>
                <th data-i18n="automation.colUser">Utilisateur</th>
                <th data-i18n="automation.colAction">Action</th>
                <th data-i18n="automation.colDetail">Détail</th>
              </tr>
            </thead>
            <tbody id="act-body"></tbody>
          </table>
        </div>
      </section>
    </div>

    <div id="app-footer"></div>
    <script src="app.js?v=8"></script>
    <script src="i18n.js?v=7"></script>
    <script src="theme.js?v=1"></script>
    <script src="nav.js?v=6"></script>
    <script src="footer.js?v=5"></script>
    <script>
      if (!getToken()) window.location.href = "index.html";
      document.getElementById("logout").onclick = () => {
        localStorage.removeItem("con4mity_token");
        window.location.href = "index.html";
      };

      async function loadPlaybooks() {
        const { items } = await apiGet("/playbooks");
        const root = document.getElementById("playbooks");
        root.innerHTML = "";
        for (const it of items) {
          const slug = it.slug;
          const card = document.createElement("article");
          card.className = "chart-card";
          card.innerHTML = `
            <h3>${t("playbook." + slug + ".title")}</h3>
            <p class="muted" style="font-size:0.85rem">${t("playbook." + slug + ".desc")}</p>
            <button type="button" class="btn btn--sm btn--primary" data-slug="${slug}">${t("automation.run")}</button>`;
          card.querySelector("button").onclick = async () => {
            try {
              await apiPost("/playbooks/" + slug, {});
              await loadActivity();
            } catch (e) {
              alert(e.message);
            }
          };
          root.appendChild(card);
        }
      }

      async function loadActivity() {
        let rows = [];
        try {
          rows = await apiGet("/activity");
        } catch (_) {
          rows = [];
        }
        const tb = document.getElementById("act-body");
        tb.innerHTML = "";
        if (!rows.length) {
          const tr = document.createElement("tr");
          tr.innerHTML = `<td colspan="4" class="table-empty">${t("automation.emptyHistory")}</td>`;
          tb.appendChild(tr);
          return;
        }
        for (const r of rows) {
          const tr = document.createElement("tr");
          tr.innerHTML = `<td class="mono">${r.created_at || ""}</td><td>${r.username || ""}</td><td>${r.action_key || ""}</td><td class="msg">${(r.detail || "").slice(0, 200)}</td>`;
          tb.appendChild(tr);
        }
      }

      document.getElementById("btn-refresh").onclick = () => loadActivity();

      window.addEventListener("con4mity-lang", () => {
        loadPlaybooks().catch(() => {});
        loadActivity();
      });

      loadPlaybooks().catch((e) => alert(e.message));
      loadActivity().catch(() => {});
    </script>
  </body>
</html>
