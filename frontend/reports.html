<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Con4mity — Rapports</title>
    <link rel="stylesheet" href="style.css?v=5" />
  </head>
  <body class="page" data-page-title-key="pageTitle.reports" data-nav-active="reports">
    <div class="shell">
      <header class="topbar">
        <div class="topbar__left">
          <img
            class="topbar__logo"
            src="assets/logo.png?v=5"
            alt="Con4mity"
            width="120"
            height="44"
            decoding="async"
          />
          <div class="topbar__titles">
            <p class="brand-name">CON4MITY</p>
            <p class="brand-sub">Open Source SIEM</p>
          </div>
        </div>
        <div class="topbar__right">
          <nav class="topbar__nav" aria-label="Main">
            <div id="main-nav-links" class="nav-links"></div>
          </nav>
          <button type="button" class="btn btn--ghost" id="logout" data-i18n="nav.logout">Déconnexion</button>
        </div>
      </header>

      <section class="page-intro">
        <h1 data-i18n="nav.reports">Rapports</h1>
        <p class="muted" data-i18n="reports.subtitle">Exports simples</p>
      </section>

      <section class="panel">
        <p class="muted" data-i18n="reports.hint">Les exports utilisent une requête unique.</p>
        <p style="margin-top: 1rem">
          <button type="button" class="btn btn--primary" id="btn-logs-csv" data-i18n="reports.exportLogs">
            Export logs
          </button>
          <button type="button" class="btn btn--ghost" id="btn-alerts-csv" data-i18n="reports.exportAlerts">
            Export alertes
          </button>
        </p>
      </section>
    </div>

    <div id="app-footer"></div>
    <script src="app.js?v=7"></script>
    <script src="i18n.js?v=5"></script>
    <script src="nav.js?v=5"></script>
    <script src="footer.js?v=5"></script>
    <script>
      if (!getToken()) window.location.href = "index.html";
      document.getElementById("logout").onclick = () => {
        localStorage.removeItem("con4mity_token");
        window.location.href = "index.html";
      };

      function downloadCsv(filename, rows) {
        if (!rows.length) {
          alert(typeof t === "function" ? t("dashboard.noLogs") : "Empty");
          return;
        }
        const headers = Object.keys(rows[0]);
        const esc = (v) => {
          const s = v == null ? "" : String(v);
          if (/[",\n]/.test(s)) return `"${s.replace(/"/g, '""')}"`;
          return s;
        };
        const lines = [headers.join(",")].concat(
          rows.map((r) => headers.map((h) => esc(r[h])).join(",")),
        );
        const blob = new Blob([lines.join("\n")], { type: "text/csv;charset=utf-8" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = filename;
        a.click();
        URL.revokeObjectURL(a.href);
      }

      document.getElementById("btn-logs-csv").onclick = async () => {
        const rows = await apiGet("/logs", { size: 300 });
        const flat = rows.map((r, i) => ({
          idx: i + 1,
          time: r.con4mity_ui_timestamp || r["@timestamp"] || r.received_at || "",
          host: r.con4mity_ui_host || r.host?.name || r.host || "",
          severity: r.con4mity_ui_severity || r.severity || r.log?.level || "",
          message: (r.con4mity_ui_message || r.message || r.raw_message || "").slice(0, 500),
        }));
        downloadCsv("con4mity-logs.csv", flat);
      };

      document.getElementById("btn-alerts-csv").onclick = async () => {
        const rows = await apiGet("/alerts");
        downloadCsv("con4mity-alerts.csv", rows);
      };
    </script>
  </body>
</html>
