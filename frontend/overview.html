<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Con4mity — Vue d'ensemble</title>
    <link rel="stylesheet" href="style.css?v=11" />
  </head>
  <body class="page" data-page-title-key="pageTitle.overview" data-nav-active="overview">
    <div class="shell">
      <header class="topbar">
        <div class="topbar__left">
          <img
            class="topbar__logo"
            src="assets/logo.png?v=5"
            alt="Con4mity"
            width="120"
            height="44"
            decoding="async"
          />
          <div class="topbar__titles">
            <p class="brand-name">CON4MITY</p>
            <p class="brand-sub">Open Source SIEM</p>
          </div>
        </div>
        <div class="topbar__right">
          <nav class="topbar__nav" aria-label="Main">
            <div id="main-nav-links" class="nav-links"></div>
          </nav>
          <button type="button" class="btn btn--ghost" id="logout" data-i18n="nav.logout">Déconnexion</button>
        </div>
      </header>

      <section class="page-intro">
        <h1 data-i18n="nav.overview">Vue d'ensemble</h1>
        <p class="muted" data-i18n="overview.subtitle">
          Synthèse temps réel (données légères pour matériel modeste)
        </p>
      </section>

      <section class="toggle-row">
        <label><input type="checkbox" id="w-charts" checked /> <span data-i18n="overview.widgets">Graphiques</span></label>
        <button type="button" class="btn btn--sm btn--primary" id="btn-refresh" data-i18n="overview.refresh">
          Rafraîchir
        </button>
      </section>

      <section class="kpis" id="kpi-row">
        <article class="kpi kpi--accent">
          <span class="kpi__label" data-i18n="overview.kpiIncidents">Incidents ouverts</span>
          <span class="kpi__value" id="kpi-incidents">—</span>
        </article>
        <article class="kpi">
          <span class="kpi__label" data-i18n="overview.kpiCritical">Alertes critiques</span>
          <span class="kpi__value" id="kpi-critical">—</span>
        </article>
        <article class="kpi">
          <span class="kpi__label" data-i18n="overview.kpiEvents">Événements</span>
          <span class="kpi__value" id="kpi-events">—</span>
        </article>
        <article class="kpi">
          <span class="kpi__label" data-i18n="overview.kpiNetwork">Activité récente</span>
          <span class="kpi__value" id="kpi-net">—</span>
        </article>
        <article class="kpi">
          <span class="kpi__label" data-i18n="dashboard.kpiNew">Nouvelles alertes</span>
          <span class="kpi__value" id="kpi-new">—</span>
        </article>
      </section>

      <div id="charts-wrap">
        <section class="chart-grid">
          <article class="chart-card">
            <h3 data-i18n="overview.chartTimeline">Volume (24 h)</h3>
            <canvas id="chart-timeline" height="180"></canvas>
          </article>
          <article class="chart-card">
            <h3 data-i18n="overview.chartHosts">Hôtes actifs</h3>
            <canvas id="chart-hosts" height="180"></canvas>
          </article>
        </section>

        <section class="panel" style="margin-bottom: 1rem">
          <div class="panel__head">
            <h2 data-i18n="overview.timelineTitle">Frise chronologique</h2>
          </div>
          <div class="timeline-strip" id="timeline-strip" aria-hidden="true"></div>
        </section>

        <section class="panel map-grid">
          <div>
            <div class="panel__head">
              <h2 data-i18n="overview.mapTitle">Carte</h2>
            </div>
            <div class="map-placeholder" data-i18n="overview.mapBody">…</div>
          </div>
          <div class="source-cols">
            <div class="source-col">
              <h3 class="source-col__title muted" data-i18n="overview.topHosts">Hôtes</h3>
              <ul class="ip-list" id="host-list"></ul>
            </div>
            <div class="source-col">
              <h3 class="source-col__title muted" data-i18n="overview.topIps">Adresses IP</h3>
              <ul class="ip-list" id="ip-list"></ul>
            </div>
          </div>
        </section>
      </div>
    </div>

    <div id="app-footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="app.js?v=7"></script>
    <script src="i18n.js?v=6"></script>
    <script src="nav.js?v=5"></script>
    <script src="footer.js?v=5"></script>
    <script>
      if (!getToken()) window.location.href = "index.html";
      document.getElementById("logout").onclick = () => {
        localStorage.removeItem("con4mity_token");
        window.location.href = "index.html";
      };

      const LS_CHARTS = "con4mity_show_charts";
      if (localStorage.getItem(LS_CHARTS) === "0") {
        document.getElementById("w-charts").checked = false;
        document.getElementById("charts-wrap").style.display = "none";
      }
      document.getElementById("w-charts").onchange = () => {
        const on = document.getElementById("w-charts").checked;
        localStorage.setItem(LS_CHARTS, on ? "1" : "0");
        document.getElementById("charts-wrap").style.display = on ? "" : "none";
      };

      let chartLine = null;
      let chartBar = null;

      function applyChartTheme() {
        if (typeof Chart === "undefined") return;
        Chart.defaults.color = "#94a3b8";
        Chart.defaults.borderColor = "#2d3348";
      }

      function renderTimelineStrip(timeline) {
        const el = document.getElementById("timeline-strip");
        el.innerHTML = "";
        const max = Math.max(1, ...timeline.map((x) => x.count));
        for (const b of timeline) {
          const d = document.createElement("div");
          d.className = "timeline-bar";
          d.style.height = `${8 + (b.count / max) * 64}px`;
          d.title = `${b.label}: ${b.count}`;
          el.appendChild(d);
        }
      }

      function renderHostList(topHosts) {
        const ul = document.getElementById("host-list");
        ul.innerHTML = "";
        if (!topHosts.length) {
          const li = document.createElement("li");
          li.className = "muted";
          li.textContent = t("overview.noHosts");
          ul.appendChild(li);
          return;
        }
        for (const h of topHosts) {
          const li = document.createElement("li");
          li.textContent = `${h.host} — ${h.count}`;
          ul.appendChild(li);
        }
      }

      function renderIpList(topIps) {
        const ul = document.getElementById("ip-list");
        ul.innerHTML = "";
        if (!topIps.length) {
          const li = document.createElement("li");
          li.className = "muted";
          li.textContent = t("overview.noIps");
          ul.appendChild(li);
          return;
        }
        for (const x of topIps) {
          const li = document.createElement("li");
          li.textContent = `${x.ip} — ${x.count}`;
          ul.appendChild(li);
        }
      }

      async function loadOverview() {
        const data = await apiGet("/overview");
        const s = data.stats || {};
        document.getElementById("kpi-incidents").textContent = s.incidents_open ?? "0";
        document.getElementById("kpi-critical").textContent = s.critical_open ?? "0";
        document.getElementById("kpi-events").textContent = String(data.events_sampled ?? 0);
        document.getElementById("kpi-net").textContent = String(data.activity_recent_count ?? 0);
        document.getElementById("kpi-new").textContent = s.new_alerts ?? "0";

        const tl = data.timeline || [];
        renderTimelineStrip(tl);
        renderHostList(data.top_hosts || []);
        renderIpList(data.top_source_ips || []);

        const chartsOn = document.getElementById("w-charts").checked;
        if (typeof Chart === "undefined" || !chartsOn) return;
        applyChartTheme();
        const labels = tl.map((x) => x.label);
        const counts = tl.map((x) => x.count);
        const hosts = data.top_hosts || [];
        const hLabels = hosts.map((x) => x.host);
        const hCounts = hosts.map((x) => x.count);

        const ctx1 = document.getElementById("chart-timeline");
        const ctx2 = document.getElementById("chart-hosts");
        if (chartLine) chartLine.destroy();
        if (chartBar) chartBar.destroy();
        chartLine = new Chart(ctx1, {
          type: "line",
          data: {
            labels,
            datasets: [
              {
                label: "events",
                data: counts,
                borderColor: "#2b8cff",
                backgroundColor: "rgba(43,140,255,0.15)",
                fill: true,
                tension: 0.25,
              },
            ],
          },
          options: { plugins: { legend: { display: false } }, scales: { x: { ticks: { maxRotation: 45 } } } },
        });
        chartBar = new Chart(ctx2, {
          type: "bar",
          data: {
            labels: hLabels,
            datasets: [{ label: "hits", data: hCounts, backgroundColor: "#2b8cff" }],
          },
          options: { indexAxis: "y", plugins: { legend: { display: false } } },
        });
      }

      document.getElementById("btn-refresh").onclick = () => loadOverview().catch((e) => alert(e.message));

      window.addEventListener("con4mity-lang", () => loadOverview().catch(() => {}));

      (async () => {
        try {
          await loadOverview();
        } catch (e) {
          alert(e.message);
        }
        setInterval(() => loadOverview().catch(() => {}), 60_000);
      })();
    </script>
  </body>
</html>
