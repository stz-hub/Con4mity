# Stack "sonde" (Raspberry Pi côté client) — modèle MSSP, cf. docs/ARCHITECTURE.md.
# Le central (OpenSearch sécu, backend, PostgreSQL, dashboard) tourne séparément
# sur le Proxmox et n'est PAS déployé par ce fichier.
#
# Périmètre ici : collecte locale + stockage local 90j + détection de secours
# (si la sonde est coupée du central). Les alertes de secours partent vers le
# webhook du central via CENTRAL_DASHBOARD_HOST/PORT (tunnel WireGuard).

services:

  # ── Stockage local (rétention 90j) ───────────────────────────────────────
  opensearch:
    image: opensearchproject/opensearch:2.11.0
    environment:
      - discovery.type=single-node
      - OPENSEARCH_JAVA_OPTS=${OS_JAVA_OPTS:--Xms1g -Xmx1g}
      - DISABLE_SECURITY_PLUGIN=true
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    networks:
      - con4mity
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── Collecte logs Pi + réception clients/réseau ──────────────────────────
  fluentbit:
    image: fluent/fluent-bit:latest
    user: root
    environment:
      - FLB_HOSTNAME=${COLLECTOR_HOSTNAME:-con4mity-pi}
      - OPENSEARCH_HOST=opensearch
    volumes:
      - ./infra/collector/pi/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./infra/collector/pi/parsers.conf:/fluent-bit/etc/parsers.conf:ro
      - /var/log:/var/log:ro
      - /tmp/flb:/tmp
    ports:
      - "514:514/udp"
      - "24224:24224"
      - "2020:2020"
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - con4mity
    restart: unless-stopped

  # ── Détection locale de secours (si tunnel vers le central coupé) ────────
  elastalert:
    image: jertel/elastalert2:latest
    environment:
      - OPENSEARCH_HOST=opensearch
      - OPENSEARCH_PORT=9200
      - DASHBOARD_IP=${CENTRAL_DASHBOARD_HOST}
      - DASHBOARD_PORT=${CENTRAL_DASHBOARD_PORT:-8000}
      - WEBHOOK_TOKEN=${WEBHOOK_TOKEN}
    volumes:
      - ./infra/detection/elastalert2/config.yaml.template:/opt/elastalert/config.yaml.template:ro
      - ./infra/detection/elastalert2/entrypoint.sh:/opt/elastalert/entrypoint.sh:ro
      - ./infra/detection/elastalert2/rules/active:/opt/elastalert/rules/active:ro
    entrypoint: ["/bin/sh", "/opt/elastalert/entrypoint.sh"]
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - con4mity
    restart: unless-stopped

networks:
  con4mity:
    driver: bridge

volumes:
  opensearch-data:
