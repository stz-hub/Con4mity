description: Détection de modification d'un groupe à privilèges dans l'AD
filter:
- query:
    query_string:
      query: (EventID:(4728 OR 4732 OR 4756)) AND (GroupName:(*Domain\ Admins* OR
        *Enterprise\ Admins* OR *Schema\ Admins* OR *Administrators*))
index: con4mity-logs-*
name: Privilege Group Modified
priority: 4
type: any
timestamp_field: '@timestamp'
alert:
- post
http_post_url: http://__DASHBOARD__/api/webhook/alert
http_post_headers:
  X-Webhook-Token: __TOKEN__
  Content-Type: application/json
http_post_static_payload:
  rule_name: Privilege Group Modified
  severity: critical
http_post_payload:
  host: host
realert:
  minutes: 1
