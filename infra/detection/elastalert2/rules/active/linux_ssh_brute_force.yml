description: Détection de tentatives de connexions SSH par bruteforce
filter:
- query:
    query_string:
      query: message:(Failed\ password\ for OR Invalid\ user)
index: con4mity-logs-*
name: SSH Brute Force Detection
priority: 3
type: any
timestamp_field: '@timestamp'
alert:
- post
http_post_url: http://__DASHBOARD__/api/webhook/alert
http_post_headers:
  X-Webhook-Token: __TOKEN__
  Content-Type: application/json
http_post_static_payload:
  rule_name: SSH Brute Force Detection
  severity: high
http_post_payload:
  host: host
realert:
  minutes: 1
