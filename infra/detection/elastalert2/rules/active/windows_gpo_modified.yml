description: Détection de modification d'une stratégie de groupe (GPO)
filter:
- query:
    query_string:
      query: (EventID:(5136 OR 5137 OR 5141)) AND ObjectClass:groupPolicyContainer
index: con4mity-logs-*
name: GPO Modified
priority: 3
type: any
timestamp_field: '@timestamp'
alert:
- post
http_post_url: http://__DASHBOARD__/api/webhook/alert
http_post_headers:
  X-Webhook-Token: __TOKEN__
  Content-Type: application/json
http_post_static_payload:
  rule_name: GPO Modified
  severity: high
http_post_payload:
  host: host
realert:
  minutes: 1
