description: Détection de toute modification des sudoers sur le système
filter:
- query:
    query_string:
      query: message:(*\/etc\/sudoers* OR *sudo\:\ \/etc\/sudoers.d\/user\:\ parsed\
        OK* OR *usermod\:\ adding\ user\ to\ group\ sudo*)
index: con4mity-logs-*
name: Sudoers modification
priority: 4
type: any
timestamp_field: '@timestamp'
alert:
- post
http_post_url: http://__DASHBOARD__/api/webhook/alert
http_post_headers:
  X-Webhook-Token: __TOKEN__
  Content-Type: application/json
http_post_static_payload:
  rule_name: Sudoers modification
  severity: critical
http_post_payload:
  host: host
realert:
  minutes: 1
