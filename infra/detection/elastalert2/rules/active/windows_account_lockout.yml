description: Détection de verrouillage de compte utilisateur
filter:
- query:
    query_string:
      query: EventID:4740
index: con4mity-logs-*
name: Account Lockout
priority: 2
type: any
timestamp_field: '@timestamp'
alert:
- post
http_post_url: http://__DASHBOARD__/api/webhook/alert
http_post_headers:
  X-Webhook-Token: __TOKEN__
  Content-Type: application/json
http_post_static_payload:
  rule_name: Account Lockout
  severity: medium
http_post_payload:
  host: host
realert:
  minutes: 1
