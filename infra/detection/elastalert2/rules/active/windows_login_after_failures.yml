description: Détection de connexions (réseau ou rdp) réussies après plusieurs échecs
  de connexion
filter:
- query:
    query_string:
      query: (EventID:4625 AND (LogonType:(3 OR 10))) AND (EventID:4624 AND (LogonType:(3
        OR 10)))
index: con4mity-logs-*
name: Login after failures
priority: 3
type: any
timestamp_field: '@timestamp'
alert:
- post
http_post_url: http://__DASHBOARD__/api/webhook/alert
http_post_headers:
  X-Webhook-Token: __TOKEN__
  Content-Type: application/json
http_post_static_payload:
  rule_name: Login after failures
  severity: high
http_post_payload:
  host: host
realert:
  minutes: 1
