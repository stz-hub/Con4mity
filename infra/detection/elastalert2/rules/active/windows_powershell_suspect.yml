description: Détection de toute utilisation suspecte de Powershell (exécution de script,
  encodage, etc.)
filter:
- query:
    query_string:
      query: EventID:4104 AND (ScriptBlockText:(*\-EncodedCommand* OR *\-WindowStyle\
        Hidden* OR *IEX* OR *Invoke\-Expression* OR *DownloadString* OR *bypass* OR
        *FromBase64String* OR *.ps1* OR *Start\-Process* OR *Invoke\-Command*))
index: con4mity-logs-*
name: Suspicious Powershell usage
priority: 4
type: any
timestamp_field: '@timestamp'
alert:
- post
http_post_url: http://__DASHBOARD__/api/webhook/alert
http_post_headers:
  X-Webhook-Token: __TOKEN__
  Content-Type: application/json
http_post_static_payload:
  rule_name: Suspicious Powershell usage
  severity: critical
http_post_payload:
  host: host
realert:
  minutes: 1
