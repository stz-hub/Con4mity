description: Detection de l'insertion d'un périphérique USB
filter:
- query:
    query_string:
      query: EventID:6416 AND (ClassName:(*DiskDrive* OR *USB\ Mass\ Storage*))
index: con4mity-logs-*
name: USB Device Connected
priority: 3
type: any
timestamp_field: '@timestamp'
alert:
- post
http_post_url: http://__DASHBOARD__/api/webhook/alert
http_post_headers:
  X-Webhook-Token: __TOKEN__
  Content-Type: application/json
http_post_static_payload:
  rule_name: USB Device Connected
  severity: high
http_post_payload:
  host: host
realert:
  minutes: 1
