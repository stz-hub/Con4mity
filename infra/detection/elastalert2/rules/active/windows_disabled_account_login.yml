description: Détection de connexion suspecte avec un compte local désactivé
filter:
- query:
    query_string:
      query: EventID:4625 AND SubStatus:0xC0000072
index: con4mity-logs-*
name: Connection with disabled account
priority: 4
type: any
timestamp_field: '@timestamp'
alert:
- post
http_post_url: http://__DASHBOARD__/api/webhook/alert
http_post_headers:
  X-Webhook-Token: __TOKEN__
  Content-Type: application/json
http_post_static_payload:
  rule_name: Connection with disabled account
  severity: critical
http_post_payload:
  host: host
realert:
  minutes: 1
