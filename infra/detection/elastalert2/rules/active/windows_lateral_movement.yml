description: Détection de mouvement latéral via connexion réseau suspecte entre machines
filter:
- query:
    query_string:
      query: EventID:4624 AND LogonType:3 AND TargetUserName:*$
index: con4mity-logs-*
name: Lateral Movement Detection
priority: 3
type: any
timestamp_field: '@timestamp'
alert:
- post
http_post_url: http://__DASHBOARD__/api/webhook/alert
http_post_headers:
  X-Webhook-Token: __TOKEN__
  Content-Type: application/json
http_post_static_payload:
  rule_name: Lateral Movement Detection
  severity: high
http_post_payload:
  host: host
realert:
  minutes: 1
