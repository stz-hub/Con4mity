# MITRE ATT&CK: T1068 (Privilege Escalation)
description: Détection de tentatives d'escalade de privilèges
filter:
- query:
    query_string:
      query: (message:(*su\:\ \(to\ root\)* OR *session\ opened\ for\ user\ root*
        OR *su\ root*)) OR (message:(*pkexec* OR *NOPASSWD* OR *sudoedit*)) OR (message:(*TTY\=unknown*
        OR *PWD\=\/* OR *sudo\:\ sorry,\ you\ must\ have\ a\ tty*))
name: Privilege Escalation detection
priority: 3
type: any
severity: high
index: con4mity-logs-*
alert:
- post
