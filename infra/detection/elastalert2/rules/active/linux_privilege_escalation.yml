description: Détection de tentatives d'escalade de privilèges
filter:
- query:
    query_string:
      query: (message:(*su\:\ \(to\ root\)* OR *session\ opened\ for\ user\ root*
        OR *su\ root*)) OR (message:(*pkexec* OR *NOPASSWD* OR *sudoedit*)) OR (message:(*TTY\=unknown*
        OR *PWD\=\/* OR *sudo\:\ sorry,\ you\ must\ have\ a\ tty*))
index: con4mity-logs-*
name: Privilege Escalation detection
priority: 3
type: any
timestamp_field: '@timestamp'
alert:
- post
http_post_url: http://__DASHBOARD__/api/webhook/alert
http_post_headers:
  X-Webhook-Token: __TOKEN__
  Content-Type: application/json
http_post_static_payload:
  rule_name: Privilege Escalation detection
  severity: high
http_post_payload:
  host: host
realert:
  minutes: 1
