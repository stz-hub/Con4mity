description: Détection de tentatives d'accès à des fichiers sensibles
filter:
- query:
    query_string:
      query: message:(*\/etc\/shadow* OR *\/etc\/passwd* OR *\/etc\/sudoers* OR *\/etc\/ssh\/*
        OR *\/etc\/ssl\/* OR *\/etc\/mysql\/* OR *\/etc\/apache2\/* OR *\/etc\/httpd\/*
        OR *\/etc\/nginx\/* OR *.ssh\/authorized_keys*)
index: con4mity-logs-*
name: Sensitive File Access Detection
priority: 4
type: any
timestamp_field: '@timestamp'
alert:
- post
http_post_url: http://__DASHBOARD__/api/webhook/alert
http_post_headers:
  X-Webhook-Token: __TOKEN__
  Content-Type: application/json
http_post_static_payload:
  rule_name: Sensitive File Access Detection
  severity: critical
http_post_payload:
  host: host
realert:
  minutes: 1
