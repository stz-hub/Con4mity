description: Détection de la création d'un nouveau compte administrateur dans l'Active
  Directory
filter:
- query:
    query_string:
      query: EventID:4720 AND (EventID:4732 AND (GroupName:(*Administrators* OR *Domain\
        Admins*)))
index: con4mity-logs-*
name: New Admin Account Created in AD
priority: 4
type: any
timestamp_field: '@timestamp'
alert:
- post
http_post_url: http://__DASHBOARD__/api/webhook/alert
http_post_headers:
  X-Webhook-Token: __TOKEN__
  Content-Type: application/json
http_post_static_payload:
  rule_name: New Admin Account Created in AD
  severity: critical
http_post_payload:
  host: host
realert:
  minutes: 1
