description: Détection de toute modification de mots de passe sur le système
filter:
- query:
    query_string:
      query: message:(*passwd\:\ password\ updated* OR *passwd\:\ password\ changed*)
index: con4mity-logs-*
name: Edited password
priority: 3
type: any
timestamp_field: '@timestamp'
alert:
- post
http_post_url: http://__DASHBOARD__/api/webhook/alert
http_post_headers:
  X-Webhook-Token: __TOKEN__
  Content-Type: application/json
http_post_static_payload:
  rule_name: Edited password
  severity: high
http_post_payload:
  host: host
realert:
  minutes: 1
