description: Détection d'une tentative de Pass-the-Hash via authentification NTLM
  suspecte
filter:
- query:
    query_string:
      query: (EventID:4624 AND LogonType:3 AND AuthenticationPackageName:NTLM) AND
        (NOT TargetUserName:*$)
index: con4mity-logs-*
name: Pass The Hash
priority: 4
type: any
timestamp_field: '@timestamp'
alert:
- post
http_post_url: http://__DASHBOARD__/api/webhook/alert
http_post_headers:
  X-Webhook-Token: __TOKEN__
  Content-Type: application/json
http_post_static_payload:
  rule_name: Pass The Hash
  severity: critical
http_post_payload:
  host: host
realert:
  minutes: 1
