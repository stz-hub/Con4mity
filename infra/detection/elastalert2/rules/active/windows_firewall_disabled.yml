description: Détection de la désactivation du pare-feu Windows
filter:
- query:
    query_string:
      query: EventID:(2002 OR 2083 OR 2003 OR 2082 OR 2008)
index: con4mity-logs-*
name: Firewall Disabled and/or Rules Deleted
priority: 2
type: any
timestamp_field: '@timestamp'
alert:
- post
http_post_url: http://__DASHBOARD__/api/webhook/alert
http_post_headers:
  X-Webhook-Token: __TOKEN__
  Content-Type: application/json
http_post_static_payload:
  rule_name: Firewall Disabled and/or Rules Deleted
  severity: medium
http_post_payload:
  host: host
realert:
  minutes: 1
