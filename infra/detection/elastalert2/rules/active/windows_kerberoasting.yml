description: Tentative de Kerberoasting via demande de ticket de service
filter:
- query:
    query_string:
      query: (EventID:4769 AND TicketEncryptionType:0x17) AND (NOT ServiceName:*$)
index: con4mity-logs-*
name: Kerberoasting Detection
priority: 3
type: any
timestamp_field: '@timestamp'
alert:
- post
http_post_url: http://__DASHBOARD__/api/webhook/alert
http_post_headers:
  X-Webhook-Token: __TOKEN__
  Content-Type: application/json
http_post_static_payload:
  rule_name: Kerberoasting Detection
  severity: high
http_post_payload:
  host: host
realert:
  minutes: 1
