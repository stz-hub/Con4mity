description: Détection de toute utilisation sudo suspecte
filter:
- query:
    query_string:
      query: message:(*sudo\:\ authentication\ failure* OR *sudo\:\ unable\ to\ resolve\
        host* OR *user\ NOT\ in\ sudoers* OR *COMMAND\=\/bin\/bash* OR *COMMAND\=\/bin\/sh*)
index: con4mity-logs-*
name: Suspicious Sudo usage
priority: 3
type: any
timestamp_field: '@timestamp'
alert:
- post
http_post_url: http://__DASHBOARD__/api/webhook/alert
http_post_headers:
  X-Webhook-Token: __TOKEN__
  Content-Type: application/json
http_post_static_payload:
  rule_name: Suspicious Sudo usage
  severity: high
http_post_payload:
  host: host
realert:
  minutes: 1
