services:
  opensearch:
    image: opensearchproject/opensearch:2.11.0
    container_name: con4mity-test-opensearch
    environment:
      - discovery.type=single-node
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - DISABLE_SECURITY_PLUGIN=true
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -q '\"status\"'"]
      interval: 10s
      timeout: 5s
      retries: 12

  elastalert:
    image: jertel/elastalert2:latest
    container_name: con4mity-test-elastalert
    depends_on:
      opensearch:
        condition: service_healthy
    volumes:
      - ./rules:/opt/elastalert/rules:ro
      - ./config.yaml:/opt/elastalert/config.yaml:ro
    command: ["--verbose", "--config", "/opt/elastalert/config.yaml"]
