# Copie locale de ../../rules/ssh_bruteforce.yml pour le labo de test.
# Seule différence : alert: debug (affiche dans les logs du conteneur au lieu
# d'appeler le webhook du backend, qui n'existe pas en local).
name: SSH Brute Force Detection (local test)
type: frequency
index: con4mity-logs-*
num_events: 10
timeframe:
  minutes: 1
filter:
  - query:
      query_string:
        query: 'message:"Failed password" OR message:"authentication failure"'
query_key:
  - host
realert:
  minutes: 5

alert:
  - debug
