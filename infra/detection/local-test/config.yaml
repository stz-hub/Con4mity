# Config ElastAlert2 — labo local (sans Proxmox)
# es_host = nom du service docker-compose, pas une IP
es_host: opensearch
es_port: 9200
use_ssl: false
rules_folder: /opt/elastalert/rules

# Vérifications plus fréquentes qu'en prod, pour itérer vite en test
run_every:
  seconds: 30
buffer_time:
  minutes: 5

writeback_index: elastalert_status
alert_time_limit:
  hours: 2
