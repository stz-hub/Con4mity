[SERVICE]
    Flush           5
    Log_Level       info
    HTTP_Server     On
    HTTP_Listen     0.0.0.0
    HTTP_Port       2020
    storage.metrics On
    Parsers_File    parsers.conf

# ── Auto-monitoring du Pi ──────────────────────────────────────────────────

[INPUT]
    Name              tail
    Path              /var/log/auth.log
    Tag               con4mity.pi.auth
    Read_from_Head    false
    DB                /tmp/flb-pi-auth.db
    Refresh_Interval  5
    Parser            syslog-rfc3164

[INPUT]
    Name              tail
    Path              /var/log/syslog
    Tag               con4mity.pi.syslog
    Read_from_Head    false
    DB                /tmp/flb-pi-syslog.db
    Refresh_Interval  5
    Parser            syslog-rfc3164

[INPUT]
    Name              tail
    Path              /var/log/kern.log
    Tag               con4mity.pi.kern
    Read_from_Head    false
    DB                /tmp/flb-pi-kern.db
    Refresh_Interval  5
    Parser            syslog-rfc3164

# ── Réception agents Linux clients (Forward protocol) ─────────────────────

[INPUT]
    Name        forward
    Listen      0.0.0.0
    Port        24224
    Tag         con4mity.client

# ── Réception périphériques réseau (syslog UDP 514) ───────────────────────

[INPUT]
    Name        syslog
    Mode        udp
    Listen      0.0.0.0
    Port        514
    Tag         con4mity.network
    Parser      syslog-rfc3164

# ── Enrichissement logs Pi ────────────────────────────────────────────────

[FILTER]
    Name          record_modifier
    Match         con4mity.pi.*
    Record        fluentbit_host ${FLB_HOSTNAME}
    Record        source_type linux

[FILTER]
    Name          modify
    Match         con4mity.pi.auth
    Add           severity high
    Add           category authentication

[FILTER]
    Name          modify
    Match         con4mity.pi.syslog
    Add           severity info
    Add           category system

[FILTER]
    Name          modify
    Match         con4mity.pi.kern
    Add           severity medium
    Add           category kernel

# ── Enrichissement logs réseau ────────────────────────────────────────────

[FILTER]
    Name          record_modifier
    Match         con4mity.network
    Record        source_type network

# ── Sortie OpenSearch ──────────────────────────────────────────────────────

[OUTPUT]
    Name               opensearch
    Match              *
    Host               ${OPENSEARCH_HOST}
    Port               9200
    Index              con4mity-logs
    Logstash_Format    On
    Logstash_Prefix    con4mity-logs
    Suppress_Type_Name On
    tls                Off
    Retry_Limit        5
    Generate_ID        On
