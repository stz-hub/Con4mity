[SERVICE]
    Flush                5
    Log_Level            info
    HTTP_Server          On
    HTTP_Listen          0.0.0.0
    HTTP_Port            2020
    storage.metrics      On

[INPUT]
    Name              tail
    Path              /var/log/auth.log
    Tag               con4mity.auth
    Read_from_Head    false
    DB                /tmp/flb-auth.db
    Refresh_Interval  5
    Parser            syslog-rfc3164

[INPUT]
    Name              tail
    Path              /var/log/syslog
    Tag               con4mity.syslog
    Read_from_Head    false
    DB                /tmp/flb-syslog.db
    Refresh_Interval  5
    Parser            syslog-rfc3164

[INPUT]
    Name              tail
    Path              /var/log/kern.log
    Tag               con4mity.kern
    Read_from_Head    false
    DB                /tmp/flb-kern.db
    Refresh_Interval  5
    Parser            syslog-rfc3164

[FILTER]
    Name          record_modifier
    Match         *
    Record        fluentbit_host ${FLB_HOSTNAME}
    Record        source_type linux

[FILTER]
    Name          modify
    Match         con4mity.auth
    Add           severity high
    Add           category authentication

[FILTER]
    Name          modify
    Match         con4mity.syslog
    Add           severity info
    Add           category system

[FILTER]
    Name          modify
    Match         con4mity.kern
    Add           severity medium
    Add           category kernel

[OUTPUT]
    Name               opensearch
    Match              *
    Host               ${OPENSEARCH_HOST}
    Port               9200
    Index              con4mity-logs
    Logstash_Format    On
    Logstash_Prefix    con4mity-logs
    Suppress_Type_Name On
    tls                Off
    Retry_Limit        5
    Generate_ID        On
