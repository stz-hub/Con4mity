[SERVICE]
    Flush           10
    Log_Level       info
    Parsers_File    parsers.conf

# ── Logs locaux ───────────────────────────────────────────────────────────

[INPUT]
    Name              tail
    Path              /var/log/auth.log
    Tag               con4mity.auth
    Read_from_Head    false
    DB                /tmp/flb-auth.db
    Refresh_Interval  5
    Parser            syslog-rfc3164

[INPUT]
    Name              tail
    Path              /var/log/syslog
    Tag               con4mity.syslog
    Read_from_Head    false
    DB                /tmp/flb-syslog.db
    Refresh_Interval  5
    Parser            syslog-rfc3164

[INPUT]
    Name              tail
    Path              /var/log/kern.log
    Tag               con4mity.kern
    Read_from_Head    false
    DB                /tmp/flb-kern.db
    Refresh_Interval  5
    Parser            syslog-rfc3164

# ── Enrichissement ────────────────────────────────────────────────────────

[FILTER]
    Name          record_modifier
    Match         *
    Record        fluentbit_host ${FLB_HOSTNAME}
    Record        source_type linux

[FILTER]
    Name          modify
    Match         con4mity.auth
    Add           severity high
    Add           category authentication

[FILTER]
    Name          modify
    Match         con4mity.syslog
    Add           severity info
    Add           category system

[FILTER]
    Name          modify
    Match         con4mity.kern
    Add           severity medium
    Add           category kernel

# ── Forward vers le Pi ────────────────────────────────────────────────────

[OUTPUT]
    Name        forward
    Match       *
    Host        ${PI_HOST}
    Port        24224
    Retry_Limit 5
